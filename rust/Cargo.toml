[workspace]
members = [
    "crates/*",
    "tools/*",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2.0.18"
tokio = "1.48.0"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
uniffi = "0.32.0"
zeroize = "1.8.2"
base64 = "0.23.1"

[profile.release]
lto = true
codegen-units = 1
