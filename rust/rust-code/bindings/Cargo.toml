[package]
name = "keygo-bindings"
version.workspace = true
edition.workspace = true

[lib]
name = "keygo_bindings"
crate-type = ["cdylib", "staticlib"]

[dependencies]
keygo-core = { path = "../core" }
thiserror.workspace = true
uuid.workspace = true
zeroize = "1.8.2"

tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread"] }
uniffi = { version = "0.32.0", features = ["tokio", "cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
