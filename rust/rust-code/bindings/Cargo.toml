[package]
name = "keygo-bindings"
version = "0.1.0"
edition = "2024"

[lib]
name = "keygo_bindings"
crate-type = ["cdylib", "staticlib"]

[dependencies]
lib = { path = "../lib" }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread"] }
uniffi = { version = "0.31.1", features = ["tokio", "cli"] }
uuid = "1.23.1"

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
