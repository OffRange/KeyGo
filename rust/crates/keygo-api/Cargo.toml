[package]
name = "keygo-api"
description = "KeyGo sync API wire types, shared by the server and the client."
version.workspace = true
edition.workspace = true

[features]
server = ["dep:getrandom", "dep:sha2"]

[dependencies]
keygo-core = { path = "../keygo-core" }
keygo-opaque = { path = "../keygo-opaque" }

serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
getrandom = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { workspace = true, features = ["derive"] }
unicode-normalization = "0.1.25"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[dev-dependencies]
getrandom.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex = "0.4.3"
