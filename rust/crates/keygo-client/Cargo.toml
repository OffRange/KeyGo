[package]
name = "keygo-client"
version.workspace = true
edition.workspace = true

[features]
# Exposes `sync::testing` (fake transport, token store, key and clock) to other crates' tests.
test-support = ["keygo-dpop/test-support"]

[dependencies]
keygo-core = { path = "../keygo-core", features = ["crypto"] }
keygo-api = { path = "../keygo-api" }
keygo-opaque = { path = "../keygo-opaque" }
keygo-dpop = { path = "../keygo-dpop" }

thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
base64.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

async-trait = "0.1.89"
ciborium = "0.2.2"
coset = "0.4.2"
passkey = "0.6.0"
passkey-authenticator = { version = "0.6.0", features = ["tokio"] }
# Needed so passkey JSON responses are serialized into base64 strings
passkey-types = { version = "0.6.0", features = ["serialize_bytes_as_base64_string"] }

csv = "1.4.0"
email_address = "0.2.9"
subtle = "2.6"
totp-rs = { version = "6.0.0", features = ["otpauth", "zeroize"] }
url = "2.5.8"
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
keygo-dpop = { path = "../keygo-dpop", features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
