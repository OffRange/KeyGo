[package]
name = "keygo-server"
description = "KeyGo self-hostable sync server."
version.workspace = true
edition.workspace = true

[dependencies]
keygo-opaque = { path = "../keygo-opaque" }
keygo-dpop = { path = "../keygo-dpop" }

zeroize.workspace = true
thiserror.workspace = true
base64.workspace = true

anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
hex = "0.4.3"
secrecy = "0.10.3"
tempfile = "3.27.0"
url = "2.5.8"
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace"] }
uuid = { workspace = true, features = ["v4"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time"] }
unicode-normalization = "0.1.25"
humantime = "2.4.0"
hmac = "0.13.0"
sha2 = { version = "0.11.0", features = ["zeroize"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }
moka = { version = "0.12.16", features = ["sync"] }

[dev-dependencies]
keygo-dpop = { path = "../keygo-dpop", features = ["test-support"] }

http-body-util = "0.1.5"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
