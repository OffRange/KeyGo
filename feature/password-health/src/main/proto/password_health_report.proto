syntax = "proto3";

package de.davis.keygo.feature.password_health.data.local.model;
option java_multiple_files = true;

message ProtoHealthReportStore {
  bytes wrapped_key = 1;
  bytes wrapped_key_nonce = 2;
  bytes ciphertext = 3;
  bytes iv = 4;
}

message ProtoStoredHealthReport {
  repeated ProtoStoredItem items = 1;
  repeated ProtoRelationFinding relation_finding = 2;
  repeated ProtoCheckGap gaps = 3;
  int64 generated_at_epoch_millis = 4;
  int32 algorithm_version = 5;
  bool breach_check_enabled = 6;
}

message ProtoStoredItem {
  bytes id = 1;                          // 16 raw bytes of the UUID
  bytes fingerprint = 2;                 // raw digest, not hex/base64
  optional int32 breach_occurrences = 3; // unset = never looked up
  ProtoPasswordScore score = 4;
  bool unreadable = 5;
}

message ProtoRelationFinding {
  repeated uint32 item_refs = 1;
  ProtoRelationType type = 2;
}

message ProtoCheckGap {
  ProtoCheckKind kind = 1;
  ProtoGapReason reason = 2;
  repeated uint32 unchecked_item_refs = 3;
}

enum ProtoPasswordScore {
  PASSWORD_SCORE_NONE = 0;
  PASSWORD_SCORE_RIDICULOUS = 1;
  PASSWORD_SCORE_WEAK = 2;
  PASSWORD_SCORE_MODERATE = 3;
  PASSWORD_SCORE_STRONG = 4;
  PASSWORD_SCORE_EXCELLENT = 5;
}

enum ProtoRelationType {
  RELATION_TYPE_REUSED = 0;
  RELATION_TYPE_SIMILAR = 1;
}

enum ProtoCheckKind {
  CHECK_KIND_STRENGTH = 0;
  CHECK_KIND_REUSE = 1;
  CHECK_KIND_BREACH = 2;
  CHECK_KIND_SIMILARITY = 3;
}

enum ProtoGapReason {
  GAP_REASON_DISABLED = 0;
  GAP_REASON_UNREACHABLE = 1;
  GAP_REASON_FAILED = 2;
}
