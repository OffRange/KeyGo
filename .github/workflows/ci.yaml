name: CI

on:
  push:
    branches: [ "v2" ]
  pull_request:
    branches: [ "v2" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      rust: ${{ steps.filter.outputs.rust }}

    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - '.github/workflows/ci.yaml'

  # Fast quality gate: fmt + clippy only. Blocks both rust-test and android-test
  # so a broken Rust change doesn't waste NDK cross-compilation time.
  rust-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./rust/rust-code

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/rust-code/target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-host-
      - name: Check formatting
        run: cargo fmt --check --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Rust-native tests (no NDK). Runs in parallel with android-test once lint passes.
  rust-test:
    needs: [ detect-changes, rust-lint ]
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./rust/rust-code

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/rust-code/target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-host-
      - name: Build
        run: cargo build --workspace --all-targets --verbose
      - name: Run tests
        run: cargo test --workspace --verbose

  # Android unit tests. Waits for rust-lint when rust changed (skips past it when unchanged)
  # so NDK cross-compilation isn't triggered on code that already fails fmt/clippy.
  # buildRust (make all) runs internally via the preBuild Gradle hook and generates
  # the UniFFI Kotlin interfaces that the tests compile against.
  android-test:
    needs: [ rust-lint ]
    if: |
      always() &&
      (needs.rust-test.result == 'success' || needs.rust-test.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/rust-code/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
